<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID QR - Cyber Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}body{background:radial-gradient(circle at 50% 20%,#1e0938,#0a0b1c,#030308);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 15px;overflow-x:hidden;position:relative}.bg-orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}.orb-left{width:300px;height:300px;background:#00f0ff;top:15%;left:10%}.orb-right{width:320px;height:320px;background:#9d00ff;bottom:15%;right:10%}.nav-switch{position:absolute;top:20px;z-index:10;display:flex;gap:10px}.nav-btn{background:#ffffff14;border:1px solid #ffffff33;color:#fff;padding:8px 16px;border-radius:20px;font-family:Orbitron,sans-serif;font-size:11px;cursor:pointer;transition:.3s}.nav-btn.active,.nav-btn:hover{background:#00f0ff;color:#030308;box-shadow:0 0 15px #00f0ff99}.cyber-stage{display:flex;align-items:center;justify-content:center;width:100%;max-width:500px;position:relative;z-index:2;margin-top:30px}.cyber-stage.admin-stage{max-width:900px}.center-hub{width:100%}.card-container{background:#101124e0;backdrop-filter:blur(18px);border:1px solid #00f0ff4d;border-radius:22px;padding:35px 25px 25px;box-shadow:0 0 40px #00f0ff26,0 20px 60px #000000e6}.title{font-family:Orbitron,sans-serif;color:#fff;font-size:20px;text-align:center;letter-spacing:2px;text-shadow:0 0 12px #00f0ff;margin-bottom:22px}.input-group{display:flex;flex-direction:column;gap:11px}input,select{width:100%;padding:12px 14px;background:#ffffff0d;border:1px solid #ffffff26;border-radius:8px;color:#fff;font-size:14px;outline:none}input:focus,select:focus{border-color:#00f0ff;box-shadow:0 0 8px #00f0ff55}input::placeholder{color:#7d84a0}select option{background:#101124;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:.3s ease;margin-top:15px}.btn:disabled{opacity:.6;cursor:not-allowed}.btn-generate{background:linear-gradient(135deg,#ff2a6d,#9b00e8);color:#fff}.btn-download{background:linear-gradient(135deg,#00f0ff,#0077fe);color:#fff}.btn-whatsapp{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;text-decoration:none;display:block;text-align:center}.btn-copy{background:linear-gradient(135deg,#f90,#f50);color:#fff}.btn-reset{background:#ffffff1a;color:#bbb}#resultSection,#scanVerifyStage{display:none;text-align:center}.qr-wrapper{background:#fff;padding:14px;border-radius:12px;display:inline-block;margin:15px 0}#qrImage{display:block;width:220px;height:220px}.info-box{text-align:left;background:#ffffff0d;padding:15px;border-radius:8px;margin:15px 0;border:1px solid #ffffff1a}.info-box p{font-size:14px;color:#ddd;margin-bottom:8px;word-break:break-word}.status{min-height:20px;color:#9ff;margin-top:12px;text-align:center;font-size:13px}@media(max-width:520px){.card-container{padding:28px 18px 20px}.nav-switch{top:12px}.nav-btn{padding:7px 10px;font-size:10px}}
</style>
</head>
<body>
<div class="bg-orb orb-left"></div><div class="bg-orb orb-right"></div>
<div class="nav-switch" id="topNavSwitch"><button class="nav-btn active" id="genTabBtn" onclick="switchView('generator')">⚡ Generator</button><button class="nav-btn" id="adminTabBtn" onclick="requestAdminAccess()">📊 Google Sheet</button></div>
<div class="cyber-stage" id="generatorStage"><div class="center-hub"><div class="card-container">
<form id="studentForm"><h2 class="title">STUDENT ID QR</h2><div class="input-group"><input type="text" id="name" placeholder="Student Full Name" required><input type="text" id="uucms" placeholder="UUCMS No (Exact 12 Chars)" maxlength="12" required><input type="tel" id="phone" placeholder="Mobile No (10 Digits)" maxlength="10" required><input type="text" id="college" placeholder="College Name" required><select id="course" required><option value="">-- Choose Course --</option><option>BCA</option><option>BBA</option><option>B.COM</option></select></div><button type="submit" id="submitBtn" class="btn btn-generate">Generate QR &amp; Sync ⚡</button><p id="formStatus" class="status"></p></form>
<div id="resultSection"><h2 class="title">IDENTITY SECURED</h2><div class="qr-wrapper"><img id="qrImage" alt="Student QR Code"></div><button class="btn btn-download" onclick="downloadQR()">Download QR Code ⬇</button><a id="whatsappShareBtn" href="#" target="_blank" rel="noopener" class="btn btn-whatsapp">Share Link on WhatsApp 💬</a><button class="btn btn-reset" onclick="resetForm()">New Identity ↺</button></div>
</div></div></div>
<div class="cyber-stage" id="scanVerifyStage"><div class="center-hub"><div class="card-container"><h2 class="title">STUDENT DETAILS</h2><div class="info-box"><p><strong>Name:</strong> <span id="scanName">-</span></p><p><strong>UUCMS:</strong> <span id="scanUucms">-</span></p><p><strong>Mobile:</strong> <span id="scanPhone">-</span></p><p><strong>Course:</strong> <span id="scanCourse">-</span></p><p><strong>College:</strong> <span id="scanCollege">-</span></p></div><button class="btn btn-copy" onclick="copyStudentDetails()">Copy All Details 📋</button><button class="btn btn-download" id="scanSubmitBtn" onclick="submitScannedData()">Submit to 2nd Sheet ⚡</button><p id="scanStatus" class="status"></p></div></div></div>
<div class="cyber-stage admin-stage" id="adminStage"><div class="center-hub"><div class="card-container"><h2 class="title">GOOGLE SHEET DATABASE</h2><p style="color:#bbb;font-size:14px;margin-bottom:20px">Click below to open and view both sheets.</p><a href="https://docs.google.com/spreadsheets/d/1-NrnBqlACm4z6RD6u27zT7366Ln7r6hQ9azIg2Er1B8/edit?gid=0#gid=0" target="_blank" rel="noopener" class="btn btn-download" style="display:block;text-decoration:none;line-height:normal;margin-bottom:15px">Open Google Sheet ↗</a></div></div></div>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyvrQukAdJ_hxhmaPBl8dvs-R5RtCqAwiGAjru-8BANPxkoDV1rJTFP5Xxhm6_ByRhv/exec';
const LIVE_WEB_URL=window.location.href.split('?')[0];let currentQRUrl='',scannedPayload={};
const $=id=>document.getElementById(id);$('phone').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));$('uucms').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/\s/g,''));
function showStage(id){['generatorStage','scanVerifyStage','adminStage'].forEach(x=>$(x).style.display=x===id?'flex':'none')}
function switchView(view){showStage(view==='generator'?'generatorStage':'adminStage');$('genTabBtn').classList.toggle('active',view==='generator');$('adminTabBtn').classList.toggle('active',view==='admin')}
function requestAdminAccess(){const password=prompt('Enter Admin Password:');if(password==='Bca@1086')switchView('admin');else if(password!==null)alert('Incorrect password!')}
async function postPayload(payload){const response=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const text=await response.text();try{return JSON.parse(text)}catch{return {status:'success'}}}
$('studentForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('name').value.trim(),uucms=$('uucms').value.trim().toUpperCase(),phone=$('phone').value.trim(),college=$('college').value.trim(),course=$('course').value,button=$('submitBtn');if(uucms.length!==12||phone.length!==10){alert('Please enter valid 12-character UUCMS and 10-digit phone number.');return}button.disabled=true;button.textContent='Syncing...';$('formStatus').textContent='Saving student details...';const payload={action:'register',name,uucms,phone,college,course};try{await postPayload(payload);const qrLink=`${LIVE_WEB_URL}?name=${encodeURIComponent(name)}&uucms=${encodeURIComponent(uucms)}&phone=${encodeURIComponent(phone)}&college=${encodeURIComponent(college)}&course=${encodeURIComponent(course)}`;currentQRUrl=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(qrLink)}`;$('qrImage').src=currentQRUrl;$('whatsappShareBtn').href=`https://wa.me/?text=${encodeURIComponent(`Student Details:\nName: ${name}\nUUCMS: ${uucms}\nPhone: ${phone}\nCourse: ${course}\nCollege: ${college}\n\nVerification Link:\n${qrLink}`)}`;$('studentForm').style.display='none';$('resultSection').style.display='block'}catch(err){$('formStatus').textContent='Could not connect to Google Sheet.';alert('Error connecting to sheet. Check the Apps Script deployment.')}finally{button.disabled=false;button.textContent='Generate QR & Sync ⚡'}});
window.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search);if(!p.get('name'))return;scannedPayload={action:'scan_submit',name:p.get('name')||'',uucms:p.get('uucms')||'',phone:p.get('phone')||'',college:p.get('college')||'',course:p.get('course')||''};$('scanName').textContent=scannedPayload.name;$('scanUucms').textContent=scannedPayload.uucms;$('scanPhone').textContent=scannedPayload.phone;$('scanCourse').textContent=scannedPayload.course;$('scanCollege').textContent=scannedPayload.college;showStage('scanVerifyStage');$('topNavSwitch').style.display='none'});
function copyStudentDetails(){const text=`Student Name: ${scannedPayload.name}\nUUCMS No: ${scannedPayload.uucms}\nMobile: ${scannedPayload.phone}\nCourse: ${scannedPayload.course}\nCollege: ${scannedPayload.college}`;navigator.clipboard.writeText(text).then(()=>alert('Student details copied! 📋')).catch(()=>alert('Failed to copy text.'))}
async function submitScannedData(){const b=$('scanSubmitBtn');b.disabled=true;b.textContent='Submitting...';try{const r=await postPayload(scannedPayload);if(r.status==='success'){b.textContent='Submitted Successfully 🎉';$('scanStatus').textContent='Stored in Scanned_Submissions.'}else throw Error()}catch(e){alert('Network error or Apps Script rejected the request.');b.disabled=false;b.textContent='Submit to 2nd Sheet ⚡'}}
async function downloadQR(){if(!currentQRUrl)return;try{const r=await fetch(currentQRUrl);const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Student-QR.png';a.click()}catch{window.open(currentQRUrl,'_blank')}}
function resetForm(){$('studentForm').reset();$('studentForm').style.display='block';$('resultSection').style.display='none';$('formStatus').textContent=''}
</script></body></html>
